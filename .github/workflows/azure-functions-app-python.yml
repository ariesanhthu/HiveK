name: Agentic System CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/agentic-system/**"
      - ".github/workflows/deploy-agentic-system.yml"

  push:
    branches:
      - main
    paths:
      - "apps/agentic-system/**"
      - ".github/workflows/deploy-agentic-system.yml"

  workflow_dispatch:

concurrency:
  group: agentic-system-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test Agentic System
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/agentic-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/agentic-system/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Validate Python source
        run: python -m compileall .

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory found. Skipping pytest."
          fi

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: ci

    # Pull request chỉ chạy test.
    # Chỉ push vào main hoặc chạy thủ công mới deploy.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Heroku authentication
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          cat > ~/.netrc <<EOF
          machine api.heroku.com
            login ${HEROKU_EMAIL}
            password ${HEROKU_API_KEY}
          machine git.heroku.com
            login ${HEROKU_EMAIL}
            password ${HEROKU_API_KEY}
          EOF

          chmod 600 ~/.netrc

      - name: Prepare Agentic System source
        run: |
          git subtree split \
            --prefix apps/agentic-system \
            --branch heroku-agentic-system

      - name: Deploy Agentic System to Heroku
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          git push --force \
            "https://git.heroku.com/${HEROKU_APP_NAME}.git" \
            heroku-agentic-system:main
